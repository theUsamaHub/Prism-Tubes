<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#eae7d8"/><title>Prism Tubes</title>
<link rel="icon" type="image/png" sizes="64x64" href="%BASE_URL%assets/branding/favicon-64.png"/>
<link rel="apple-touch-icon" sizes="192x192" href="%BASE_URL%assets/branding/game-icon-192.png"/>
<link rel="preload" as="image" href="%BASE_URL%assets/branding/game-icon-192.png"/>
<style>
html,body{margin:0;background:#eae7d8}#boot-screen{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 35%,#fff9e7,#e2e9d6);color:#25554a;font-family:'Trebuchet MS',Arial,sans-serif}#boot-screen img{width:160px;height:160px;border-radius:28px;box-shadow:0 10px 30px #224d3920}#boot-screen h1{font-size:24px;margin:0;letter-spacing:2px}#boot-screen p{font-size:13px;margin:0;color:#73816b}.boot-track{width:200px;height:9px;background:#cad8bf;border-radius:10px;overflow:hidden}.boot-track span{display:block;width:0;height:100%;background:#398775;border-radius:10px}#boot-percent{font-size:14px;font-weight:bold;font-variant-numeric:tabular-nums}#boot-retry{padding:10px 20px;border:0;border-radius:10px;background:#326d5c;color:white;cursor:pointer}@keyframes boot-slide{to{transform:translateX(180%)}}@media(prefers-reduced-motion:reduce){.boot-track:after{animation:none;width:100%}}
</style></head><body>
<div id="boot-screen" role="status" aria-live="polite"><img src="%BASE_URL%assets/branding/game-icon-192.png" width="160" height="160" alt="Prism Tubes glass marble artwork" fetchpriority="high"/><h1>PRISM TUBES</h1><div class="boot-track" role="progressbar" aria-label="Startup steps completed" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><span id="boot-fill"></span></div><span id="boot-percent">0% · 0 of 4 steps</span><p id="boot-message">Getting your puzzle ready…</p><button id="boot-retry" hidden onclick="location.reload()">Reload game</button><noscript>This game needs JavaScript enabled.</noscript></div>
<div id="root"></div>
<script>window.prismBootStarted=performance.now();window.prismBootSteps=new Set();window.prismMark=function(step,label){window.prismBootSteps.add(step);var count=window.prismBootSteps.size,percent=count*25,fill=document.getElementById('boot-fill'),message=document.getElementById('boot-message');if(!fill)return;fill.style.width=percent+'%';fill.parentElement.setAttribute('aria-valuenow',count);document.getElementById('boot-percent').textContent=percent+'% · '+count+' of 4 steps';message.textContent=count===4?'Ready!':label;if(count===4){clearTimeout(window.prismBootTimeout);window.prismBootMetrics={readyMs:Math.round(performance.now()),initializationMs:Math.round(performance.now()-window.prismBootStarted)};requestAnimationFrame(function(){requestAnimationFrame(function(){document.getElementById('boot-screen')?.remove();});});}};window.prismBootTimeout=setTimeout(function(){var message=document.getElementById('boot-message');if(message){message.textContent='Still loading. Check your connection or try again.';document.getElementById('boot-retry').hidden=false;}},10000);</script>
<script type="module" src="/src/bootstrap.js"></script></body></html>
